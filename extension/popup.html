<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0e0d0b; --char:#171613; --rule:#34312b; --ivory:#efe8d8; --dim:#b9b2a2; --mute:#847d6f; --gold:#c4a265; --red:#c2392f; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--ink); color: var(--ivory); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  header { padding: 14px 16px 10px; border-bottom: 3px double var(--rule); text-align: center; }
  .kicker { font: 500 10px/1 "IBM Plex Mono", monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
  h1 { margin: 6px 0 0; font: 650 26px/1 Fraunces, Georgia, serif; letter-spacing: -.01em; }
  main { padding: 16px; }
  label { display: block; }
  textarea { width: 100%; margin-top: 8px; background: transparent; border: 0; border-bottom: 1px solid var(--rule); color: var(--ivory); font: 18px/1.35 Fraunces, Georgia, serif; resize: none; padding: 4px 0 8px; }
  textarea:focus, input:focus { outline: none; border-color: var(--gold); }
  button { margin-top: 14px; width: 100%; border: 0; background: var(--ivory); color: var(--ink); font: 600 14px "IBM Plex Sans", sans-serif; padding: 11px; cursor: pointer; letter-spacing: .02em; }
  button:hover { background: var(--gold); }
  .tip { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--dim); font-size: 12.5px; }
  .tip b { color: var(--red); font-weight: 600; }
  details { margin-top: 10px; color: var(--mute); font-size: 12px; }
  input { width: 100%; margin-top: 6px; background: var(--char); border: 1px solid var(--rule); color: var(--ivory); font: 12px "IBM Plex Mono", monospace; padding: 6px; }
</style>
</head>
<body>
  <header><span class="kicker">Election Desk 2026 · Evidence court</span><h1>The Ground Truth</h1></header>
  <main>
    <label for="claim" class="kicker">The claim on trial</label>
    <textarea id="claim" rows="3" placeholder="Paste a sentence from a news story…"></textarea>
    <button id="go">Put this on trial →</button>
    <p class="tip">On any page: highlight a sentence, right-click, choose <b>Put This On Trial</b>.</p>
    <details><summary>Settings</summary>
      <label for="app" class="kicker" style="margin-top:8px">Ground Truth app URL</label>
      <input id="app" placeholder="http://localhost:5173" />
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
